name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and scheme
        run: |
          xcodebuild -version
          xcodebuild -list -project ThreeOneOSSix.xcodeproj

      - name: Policy tests
        run: bash Tests/run_policy_tests.sh

      - name: Build
        run: |
          xcodebuild -project ThreeOneOSSix.xcodeproj -scheme 3106 \
            -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/3106.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "3106-3.1.12-unsigned.ipa" Payload
          shasum -a 256 "3106-3.1.12-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3106-3.1.12-unsigned-ipa
          path: "3106-3.1.12-unsigned.ipa"
